<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">V4 DSpark：并行 backbone、顺序 Markov 与验证前缀</title><desc id="desc">此图按 Flash-DSpark 固定配置：3 stages / block=5 / rank=256；设备实验不在本次范围，箭头是协议示意。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1600" height="900" fill="#f5f7fb"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#24344a">
<text x="60" y="66" font-size="34" font-weight="700" fill="#24344a" text-anchor="start">
<tspan x="60" dy="0">V4 DSpark：并行 backbone、顺序 Markov 与验证前缀</tspan>
</text>
<text x="60" y="106" font-size="22" font-weight="400" fill="#54647b" text-anchor="start">
<tspan x="60" dy="0">此图按 Flash-DSpark 固定配置：3 stages / block=5 / rank=256；设备实验不在本次范围，箭头是协议示意。</tspan>
</text>
<rect x="60" y="160" width="445" height="192" rx="12" fill="white" stroke="#d0d9e6" stroke-width="2"/><rect x="60" y="160" width="7" height="192" rx="3" fill="#335d9a"/>
<text x="84" y="197" font-size="25" font-weight="700" fill="#335d9a" text-anchor="start">
<tspan x="84" dy="0">目标特征与独立 context KV</tspan>
</text>
<text x="84" y="236" font-size="22" font-weight="400" fill="#24344a" text-anchor="start">
<tspan x="84" dy="0">选层 [40, 41, 42]，每处折叠四流</tspan>
<tspan x="84" dy="33.0">concat 3H=12288 → main_proj / norm</tspan>
<tspan x="84" dy="33.0">每 stage context cache [B,128,512]</tspan>
</text>
<rect x="578" y="160" width="445" height="192" rx="12" fill="white" stroke="#d0d9e6" stroke-width="2"/><rect x="578" y="160" width="7" height="192" rx="3" fill="#008a95"/>
<text x="602" y="197" font-size="25" font-weight="700" fill="#008a95" text-anchor="start">
<tspan x="602" dy="0">一次并行 draft backbone</tspan>
</text>
<text x="602" y="236" font-size="22" font-weight="400" fill="#24344a" text-anchor="start">
<tspan x="602" dy="0">已知 token + noise → [B,5,4,4096]</tspan>
<tspan x="602" dy="33.0">3 个 DSparkBlock；窗口 + block 非因果</tspan>
<tspan x="602" dy="33.0">mtp.0/1/2 是存储名，不是 1 层 MTP</tspan>
</text>
<rect x="1095" y="160" width="445" height="192" rx="12" fill="white" stroke="#d0d9e6" stroke-width="2"/><rect x="1095" y="160" width="7" height="192" rx="3" fill="#7556ad"/>
<text x="1119" y="197" font-size="25" font-weight="700" fill="#7556ad" text-anchor="start">
<tspan x="1119" dy="0">轻量顺序 Markov head</tspan>
</text>
<text x="1119" y="236" font-size="22" font-weight="400" fill="#24344a" text-anchor="start">
<tspan x="1119" dy="0">W1 / W2 各 [129280,256]</tspan>
<tspan x="1119" dy="33.0">前 token 查表 → logits bias → sample</tspan>
<tspan x="1119" dy="33.0">按位置依次选 5 个候选</tspan>
</text>
<path d="M 505 250 L 565 250" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 1023 250 L 1082 250" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="60" y="410" width="720" height="185" rx="12" fill="white" stroke="#d0d9e6" stroke-width="2"/><rect x="60" y="410" width="7" height="185" rx="3" fill="#7556ad"/>
<text x="84" y="447" font-size="25" font-weight="700" fill="#7556ad" text-anchor="start">
<tspan x="84" dy="0">Confidence → prefix survival</tspan>
</text>
<text x="84" y="486" font-size="22" font-weight="400" fill="#24344a" text-anchor="start">
<tspan x="84" dy="0">proj [1,4352]，存储 BF16 / 参考计算 FP32</tspan>
<tspan x="84" dy="33.0">sigmoid 后 c_k = 条件接受概率估计</tspan>
<tspan x="84" dy="33.0">S_k = product(c_1…c_k)，E[length] = sum(S_k)</tspan>
</text>
<rect x="830" y="410" width="710" height="185" rx="12" fill="white" stroke="#d0d9e6" stroke-width="2"/><rect x="830" y="410" width="7" height="185" rx="3" fill="#426eaf"/>
<text x="854" y="447" font-size="25" font-weight="700" fill="#426eaf" text-anchor="start">
<tspan x="854" dy="0">Target verify 与状态更新</tspan>
</text>
<text x="854" y="486" font-size="22" font-weight="400" fill="#24344a" text-anchor="start">
<tspan x="854" dy="0">阈值 / engine profile 选择验证前缀</tspan>
<tspan x="854" dy="33.0">因果 target → accept/reject / correction/bonus</tspan>
<tspan x="854" dy="33.0">只提交接受/修正结果；未接受 draft 不当作历史</tspan>
</text>
<path d="M 780 500 L 817 500" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="60" y="650" width="1480" height="155" rx="12" fill="white" stroke="#d0d9e6" stroke-width="2"/><rect x="60" y="650" width="7" height="155" rx="3" fill="#54647b"/>
<text x="84" y="687" font-size="25" font-weight="700" fill="#54647b" text-anchor="start">
<tspan x="84" dy="0">三组数值分别解释</tspan>
</text>
<text x="84" y="726" font-size="22" font-weight="400" fill="#24344a" text-anchor="start">
<tspan x="84" dy="0">HF nextn=1；inference + header 表明 3 个 DSpark stages。</tspan>
<tspan x="84" dy="33.0">checkpoint block=5；模型卡 vLLM example num_speculative_tokens=7，属于独立服务设置。</tspan>
<tspan x="84" dy="33.0">普通 MTP 使用独立 next-token predictor；DSpark 不套用 MTP 的 eh_proj/enorm/hnorm。</tspan>
</text>
<text x="60" y="857" font-size="20" font-weight="400" fill="#54647b" text-anchor="start">
<tspan x="60" dy="0">依据：固定 Flash-DSpark config/inference/header、DSpark paper v1、Ascend draft model/proposer；无设备收益推定。</tspan>
</text>
</g>
</svg>
