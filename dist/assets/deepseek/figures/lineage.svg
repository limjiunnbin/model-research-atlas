<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
<title id="title">DeepSeek：结构演进与 R1 底座关系</title><desc id="desc">21 个代表 checkpoint；设计变化、后训练与蒸馏分开。虚线表示设计比较，不证明直接继承权重。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1600" height="840" fill="#f5f7fb"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#24344a">
<text x="60" y="66" font-size="34" font-weight="700" fill="#24344a" text-anchor="start">
<tspan x="60" dy="0">DeepSeek：结构演进与 R1 底座关系</tspan>
</text>
<text x="60" y="106" font-size="22" font-weight="400" fill="#54647b" text-anchor="start">
<tspan x="60" dy="0">21 个代表 checkpoint；设计变化、后训练与蒸馏分开。虚线表示设计比较，不证明直接继承权重。</tspan>
</text>
<rect x="60" y="150" width="325" height="155" rx="12" fill="white" stroke="#d0d9e6" stroke-width="2"/><rect x="60" y="150" width="7" height="155" rx="3" fill="#335d9a"/>
<text x="84" y="187" font-size="25" font-weight="700" fill="#335d9a" text-anchor="start">
<tspan x="84" dy="0">V2</tspan>
</text>
<text x="84" y="226" font-size="22" font-weight="400" fill="#24344a" text-anchor="start">
<tspan x="84" dy="0">MLA + DeepSeekMoE</tspan>
<tspan x="84" dy="33.0">60 个主干层</tspan>
</text>
<rect x="445" y="150" width="325" height="155" rx="12" fill="white" stroke="#d0d9e6" stroke-width="2"/><rect x="445" y="150" width="7" height="155" rx="3" fill="#335d9a"/>
<text x="469" y="187" font-size="25" font-weight="700" fill="#335d9a" text-anchor="start">
<tspan x="469" dy="0">V3 / V3-Base</tspan>
</text>
<text x="469" y="226" font-size="22" font-weight="400" fill="#24344a" text-anchor="start">
<tspan x="469" dy="0">3 Dense + 58 MoE</tspan>
<tspan x="469" dy="33.0">主干 61 层；MTP 单列</tspan>
</text>
<rect x="830" y="150" width="325" height="155" rx="12" fill="white" stroke="#d0d9e6" stroke-width="2"/><rect x="830" y="150" width="7" height="155" rx="3" fill="#426eaf"/>
<text x="854" y="187" font-size="25" font-weight="700" fill="#426eaf" text-anchor="start">
<tspan x="854" dy="0">V3.2 / Exp</tspan>
</text>
<text x="854" y="226" font-size="22" font-weight="400" fill="#24344a" text-anchor="start">
<tspan x="854" dy="0">DSA + Lightning Indexer</tspan>
<tspan x="854" dy="33.0">61 层；配置/代码一致</tspan>
</text>
<rect x="1215" y="150" width="325" height="155" rx="12" fill="white" stroke="#d0d9e6" stroke-width="2"/><rect x="1215" y="150" width="7" height="155" rx="3" fill="#008a95"/>
<text x="1239" y="187" font-size="25" font-weight="700" fill="#008a95" text-anchor="start">
<tspan x="1239" dy="0">V4 Flash / Pro</tspan>
</text>
<text x="1239" y="226" font-size="22" font-weight="400" fill="#24344a" text-anchor="start">
<tspan x="1239" dy="0">窗口 + CSA/HCA + mHC</tspan>
<tspan x="1239" dy="33.0">主干 43 / 61 层</tspan>
</text>
<path d="M 385 220 L 438 220" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<path d="M 770 220 L 823 220" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<path d="M 1155 220 L 1208 220" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<text x="60" y="365" font-size="23" font-weight="700" fill="#24344a" text-anchor="start">
<tspan x="60" dy="0">R1 / R1-Zero：官方基于 V3-Base；相同配置与参考代码不等于相同权重或能力。</tspan>
</text>
<rect x="60" y="398" width="410" height="155" rx="12" fill="white" stroke="#d0d9e6" stroke-width="2"/><rect x="60" y="398" width="7" height="155" rx="3" fill="#335d9a"/>
<text x="84" y="435" font-size="25" font-weight="700" fill="#335d9a" text-anchor="start">
<tspan x="84" dy="0">V3-Base</tspan>
</text>
<text x="84" y="474" font-size="22" font-weight="400" fill="#24344a" text-anchor="start">
<tspan x="84" dy="0">61 层 MLA / MoE</tspan>
<tspan x="84" dy="33.0">固定 checkpoint 配置</tspan>
</text>
<rect x="565" y="398" width="435" height="155" rx="12" fill="white" stroke="#d0d9e6" stroke-width="2"/><rect x="565" y="398" width="7" height="155" rx="3" fill="#426eaf"/>
<text x="589" y="435" font-size="25" font-weight="700" fill="#426eaf" text-anchor="start">
<tspan x="589" dy="0">R1-Zero</tspan>
</text>
<text x="589" y="474" font-size="22" font-weight="400" fill="#24344a" text-anchor="start">
<tspan x="589" dy="0">直接进行大规模 RL</tspan>
<tspan x="589" dy="33.0">未以 SFT 作前置</tspan>
</text>
<rect x="1095" y="398" width="445" height="155" rx="12" fill="white" stroke="#d0d9e6" stroke-width="2"/><rect x="1095" y="398" width="7" height="155" rx="3" fill="#426eaf"/>
<text x="1119" y="435" font-size="25" font-weight="700" fill="#426eaf" text-anchor="start">
<tspan x="1119" dy="0">R1</tspan>
</text>
<text x="1119" y="474" font-size="22" font-weight="400" fill="#24344a" text-anchor="start">
<tspan x="1119" dy="0">冷启动；两次 SFT / 两阶段 RL</tspan>
<tspan x="1119" dy="33.0">推理采样条件单列</tspan>
</text>
<path d="M 470 450 L 552 450" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 265 553 V 584 H 1040 V 465 H 1082" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="60" y="618" width="720" height="145" rx="12" fill="white" stroke="#d0d9e6" stroke-width="2"/><rect x="60" y="618" width="7" height="145" rx="3" fill="#7556ad"/>
<text x="84" y="655" font-size="25" font-weight="700" fill="#7556ad" text-anchor="start">
<tspan x="84" dy="0">R1-Distill-Qwen：1.5B / 7B / 14B / 32B</tspan>
</text>
<text x="84" y="694" font-size="22" font-weight="400" fill="#24344a" text-anchor="start">
<tspan x="84" dy="0">Qwen2 系 Dense GQA；配置与 tokenizer_config 比较</tspan>
<tspan x="84" dy="33.0">1.5B 档位取消 embedding/head 共享，逻辑参数约 1.777B</tspan>
</text>
<rect x="830" y="618" width="710" height="145" rx="12" fill="white" stroke="#d0d9e6" stroke-width="2"/><rect x="830" y="618" width="7" height="145" rx="3" fill="#7556ad"/>
<text x="854" y="655" font-size="25" font-weight="700" fill="#7556ad" text-anchor="start">
<tspan x="854" dy="0">R1-Distill-Llama：8B / 70B</tspan>
</text>
<text x="854" y="694" font-size="22" font-weight="400" fill="#24344a" text-anchor="start">
<tspan x="854" dy="0">Llama 系 Dense GQA；蒸馏 checkpoint 配置已读取</tspan>
<tspan x="854" dy="33.0">原始底座 gated，配置/tokenizer 差异保留未知</tspan>
</text>
<text x="1260" y="590" font-size="20" font-weight="400" fill="#54647b" text-anchor="middle">
<tspan x="1260" dy="0">R1 生成数据 → 蒸馏</tspan>
</text>
<text x="60" y="807" font-size="20" font-weight="400" fill="#54647b" text-anchor="start">
<tspan x="60" dy="0">依据：固定官方目录、checkpoint config、R1 README 与逐版本底座关系；无设备性能结论。</tspan>
</text>
</g>
</svg>
