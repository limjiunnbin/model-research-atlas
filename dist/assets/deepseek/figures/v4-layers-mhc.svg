</text>
<text x="894" y="537" font-size="22" font-weight="400" fill="#24344a" text-anchor="start">
<tspan x="894" dy="0">C=floor(L_kv/r)；未满窗口不生成压缩 token</tspan>
<tspan x="894" dy="33.0">主 KV、indexer key/scale、两个 FP32 状态分列</tspan>
</text>
