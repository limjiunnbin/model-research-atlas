<tspan x="84" dy="33.0">H 不合并为 4H</tspan>
</text>
<rect x="450" y="659" width="330" height="138" rx="12" fill="white" stroke="#d0d9e6" stroke-width="2"/><rect x="450" y="659" width="7" height="138" rx="3" fill="#7556ad"/>
