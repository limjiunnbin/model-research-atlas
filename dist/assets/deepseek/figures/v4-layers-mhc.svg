<tspan x="864" dy="0">hc_post</tspan>
</text>
<text x="864" y="735" font-size="22" font-weight="400" fill="#24344a" text-anchor="start">
<tspan x="864" dy="0">pre/post/comb 分开</tspan>
<tspan x="864" dy="33.0">返回 [B, L_q, 4, H]</tspan>
</text>
<rect x="1230" y="659" width="310" height="138" rx="12" fill="white" stroke="#d0d9e6" stroke-width="2"/><rect x="1230" y="659" width="7" height="138" rx="3" fill="#7556ad"/>
