<tspan x="474" dy="0">控制投影 [24, 4H]</tspan>
<tspan x="474" dy="33.0">归一化 → attention / FFN</tspan>
</text>
<rect x="840" y="659" width="330" height="138" rx="12" fill="white" stroke="#d0d9e6" stroke-width="2"/><rect x="840" y="659" width="7" height="138" rx="3" fill="#7556ad"/>
