<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
<title id="title">V3 MLA：投影、两条数学路径与 cache</title><desc id="desc">MP=1 参考口径；B 为 padded batch，L_q 为新增长度，L_kv 为可见历史长度。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1600" height="840" fill="#f5f7fb"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#24344a">
<text x="60" y="66" font-size="34" font-weight="700" fill="#24344a" text-anchor="start">
<tspan x="60" dy="0">V3 MLA：投影、两条数学路径与 cache</tspan>
</text>
<text x="60" y="106" font-size="22" font-weight="400" fill="#54647b" text-anchor="start">
<tspan x="60" dy="0">MP=1 参考口径；B 为 padded batch，L_q 为新增长度，L_kv 为可见历史长度。</tspan>
</text>
<rect x="60" y="155" width="340" height="178" rx="12" fill="white" stroke="#d0d9e6" stroke-width="2"/><rect x="60" y="155" width="7" height="178" rx="3" fill="#335d9a"/>
<text x="84" y="192" font-size="25" font-weight="700" fill="#335d9a" text-anchor="start">
<tspan x="84" dy="0">输入 hidden</tspan>
</text>
<text x="84" y="231" font-size="22" font-weight="400" fill="#24344a" text-anchor="start">
<tspan x="84" dy="0">x [B, L_q, 7168]</tspan>
<tspan x="84" dy="33.0">RMSNorm 与残差另计</tspan>
</text>
<rect x="495" y="155" width="480" height="178" rx="12" fill="white" stroke="#d0d9e6" stroke-width="2"/><rect x="495" y="155" width="7" height="178" rx="3" fill="#335d9a"/>
<text x="519" y="192" font-size="25" font-weight="700" fill="#335d9a" text-anchor="start">
<tspan x="519" dy="0">Q 低秩投影与位置分量</tspan>
</text>
<text x="519" y="231" font-size="22" font-weight="400" fill="#24344a" text-anchor="start">
<tspan x="519" dy="0">7168 → 1536 → 128 × 192</tspan>
<tspan x="519" dy="33.0">NoPE=128，RoPE=64</tspan>
</text>
<rect x="1060" y="155" width="480" height="178" rx="12" fill="white" stroke="#d0d9e6" stroke-width="2"/><rect x="1060" y="155" width="7" height="178" rx="3" fill="#335d9a"/>
<text x="1084" y="192" font-size="25" font-weight="700" fill="#335d9a" text-anchor="start">
<tspan x="1084" dy="0">KV 低秩与位置投影</tspan>
</text>
<text x="1084" y="231" font-size="22" font-weight="400" fill="#24344a" text-anchor="start">
<tspan x="1084" dy="0">7168 → 512+64，低秩部分 RMSNorm</tspan>
<tspan x="1084" dy="33.0">展开：512 → 128 × (128+128)</tspan>
</text>
<path d="M 400 235 L 482 235" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 230 155 V 133 H 1300 V 155" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="60" y="390" width="720" height="223" rx="12" fill="white" stroke="#d0d9e6" stroke-width="2"/><rect x="60" y="390" width="7" height="223" rx="3" fill="#426eaf"/>
<text x="84" y="427" font-size="25" font-weight="700" fill="#426eaf" text-anchor="start">
<tspan x="84" dy="0">展开式 / naive</tspan>
</text>
<text x="84" y="466" font-size="22" font-weight="400" fill="#24344a" text-anchor="start">
<tspan x="84" dy="0">K cache [B, L_kv, 128, 192]</tspan>
<tspan x="84" dy="33.0">V cache [B, L_kv, 128, 128]</tspan>
<tspan x="84" dy="33.0">每 token/层 128 × (192+128) = 40,960 元素</tspan>
<tspan x="84" dy="33.0">直接做 QKᵀ、softmax、加权 V</tspan>
</text>
<rect x="830" y="390" width="710" height="223" rx="12" fill="white" stroke="#d0d9e6" stroke-width="2"/><rect x="830" y="390" width="7" height="223" rx="3" fill="#008a95"/>
<text x="854" y="427" font-size="25" font-weight="700" fill="#008a95" text-anchor="start">
<tspan x="854" dy="0">吸收式 / absorb</tspan>
</text>
<text x="854" y="466" font-size="22" font-weight="400" fill="#24344a" text-anchor="start">
<tspan x="854" dy="0">latent cache [B, L_kv, 512]</tspan>
<tspan x="854" dy="33.0">RoPE cache [B, L_kv, 64]</tspan>
<tspan x="854" dy="33.0">每 token/层 512+64 = 576 元素</tspan>
<tspan x="854" dy="33.0">吸收 K/V 投影：先潜变量打分，再还原输出</tspan>
</text>
<rect x="60" y="665" width="1480" height="107" rx="12" fill="white" stroke="#d0d9e6" stroke-width="2"/><rect x="60" y="665" width="7" height="107" rx="3" fill="#54647b"/>
<text x="84" y="702" font-size="25" font-weight="700" fill="#54647b" text-anchor="start">
<tspan x="84" dy="0">共同输出与边界</tspan>
</text>
<text x="84" y="741" font-size="22" font-weight="400" fill="#24344a" text-anchor="start">
<tspan x="84" dy="0">输出投影 [7168, 16384]；参考 score [B, 128, L_q, L_kv]；分页、TP 与 dtype 按框架另核验。</tspan>
</text>
<text x="60" y="809" font-size="20" font-weight="400" fill="#54647b" text-anchor="start">
<tspan x="60" dy="0">依据：V3 固定 config、MLA.forward 与首轮代数复算。cache 元素公式不代表设备显存或性能。</tspan>
</text>
</g>
</svg>
